# ============================================================
# Smart Canteen Backend — Application Configuration
# ============================================================
# All secrets MUST be set via environment variables.
# See application-dev.yml for local development defaults.
# ============================================================

server:
  port: 8080
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# ---------------------- Spring ----------------------
spring:
  application:
    name: smart-canteen-backend
  profiles:
    active: ${SPRING_PROFILE:dev}
  devtools:
    restart:
      enabled: false

  # ---- MongoDB ----
  data:
    mongodb:
      uri: ${MONGO_URL:}

  # ---- Mail (Gmail SMTP) ----
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
        transport:
          protocol: smtp

  # ---- Thymeleaf (email templates) ----
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    cache: true

# ---------------------- JWT ----------------------
jwt:
  secret: ${JWT_SECRET:SmartCanteenSuperSecretKeyForJWTTokenGeneration2025MustBeAtLeast256Bits}
  expiration: 86400000  # 24 hours in milliseconds

# ---------------------- AWS S3 ----------------------
aws:
  s3:
    access-key: ${AWS_ACCESS_KEY_ID:}
    secret-key: ${AWS_SECRET_ACCESS_KEY:}
    region: ${AWS_REGION:ap-south-1}
    bucket-name: ${S3_BUCKET_NAME:smart-canteen-images}

# ---------------------- Razorpay ----------------------
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

# ---------------------- CORS ----------------------
app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://localhost:5174}

# ---------------------- OpenAPI / Swagger ----------------------
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# ---------------------- Logging ----------------------
logging:
  level:
    root: INFO
    com.pratik.canteen: DEBUG
    org.springframework.security: WARN
    org.springframework.data.mongodb: WARN
    org.springframework.web.socket: INFO
