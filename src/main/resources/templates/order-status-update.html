<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Canteen Order Status Update</title>
</head>
<body style="margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #0f172a; color: #f8fafc;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="min-width: 100%; background-color: #0f172a; padding: 40px 15px;">
        <tr>
            <td align="center">
                <table role="presentation" width="100%" style="max-width: 520px; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
                    <!-- Header -->
                    <tr>
                        <td style="padding: 36px 36px 20px; text-align: center; background: linear-gradient(135deg, rgba(245, 158, 11, 0.15), rgba(99, 102, 241, 0.15)); border-bottom: 1px solid rgba(255, 255, 255, 0.05);">
                            <div style="display: inline-block; width: 48px; height: 48px; line-height: 48px; border-radius: 12px; background: linear-gradient(135deg, #f59e0b, #6366f1); font-size: 24px; text-align: center; margin-bottom: 12px;">
                                🔔
                            </div>
                            <h1 style="margin: 0; font-size: 22px; font-weight: 700; color: #ffffff; letter-spacing: -0.5px;">Order Status Update</h1>
                            <p style="margin: 6px 0 0; font-size: 13px; color: #94a3b8;">Order #<span th:text="${orderId}">12345</span></p>
                        </td>
                    </tr>
                    <!-- Body -->
                    <tr>
                        <td style="padding: 32px 36px;">
                            <div style="background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 24px; text-align: center; margin-bottom: 24px;">
                                <span style="font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #94a3b8;">Current Status</span>
                                <div style="font-size: 24px; font-weight: 800; color: #38bdf8; margin: 8px 0 12px;" th:text="${status}">PREPARING</div>
                                <p style="margin: 0; font-size: 15px; color: #e2e8f0; line-height: 1.5;" th:text="${statusMessage}">Your order is now being prepared by our kitchen!</p>
                            </div>

                            <p style="margin: 0; font-size: 13px; color: #94a3b8; text-align: center; line-height: 1.5;">
                                Open your <a href="http://localhost:5173" style="color: #818cf8; text-decoration: none; font-weight: 600;">Smart Canteen App</a> to view live order tracking.
                            </p>
                        </td>
                    </tr>
                    <!-- Footer -->
                    <tr>
                        <td style="padding: 20px 36px 28px; border-top: 1px solid rgba(255, 255, 255, 0.05); text-align: center;">
                            <p style="margin: 0; font-size: 11px; color: #475569;">
                                © 2026 Smart Canteen System. All rights reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
